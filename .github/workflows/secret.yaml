name: Secret Workflow

on:
  push:
    branches:
      - main

jobs:
  use-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Show secret usage safely
        run: |
          echo "Using secret in a task..."
          # Do not echo the actual secret!
          echo "The secret is ${{ secrets.SECRET }}" # GitHub masks it automatically in logs

